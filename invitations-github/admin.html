<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><header><h1>لوحة الإدارة</h1></header>
<div id="login" class="scw"><div class="panel"><label>البريد</label><input id="em" dir="ltr"><label style="margin-top:8px">كلمة السر</label><input id="pw" type="password" dir="ltr"><div class="act"><button class="pr" id="lg">دخول</button></div><p class="err" id="lerr"></p></div></div>
<main id="app" hidden>
<section class="panel">
 <div class="tabs"><button id="tW" class="on">أعراس</button><button id="tC">مؤتمرات</button></div>
 <label>اسم العميل (للإدارة فقط)</label><input id="eName">
 <h3>اختر التصميم</h3><div class="gal" id="gal"></div>
 <h3>تفاصيل الدعوة</h3>
 <div class="grid">
  <div><label>عنوان صغير</label><input id="f_kick"></div><div><label>حرفا الاسمين / الشعار</label><input id="f_mono"></div>
  <div class="full"><label>العنوان</label><input id="f_title"></div><div class="full"><label>الأسماء / الجهة</label><input id="f_names"></div>
  <div class="full"><label>نص الدعوة</label><textarea id="f_msg"></textarea></div>
  <div><label>التاريخ</label><input id="f_date"></div><div><label>الوقت</label><input id="f_time"></div>
  <div class="full"><label>المكان</label><input id="f_place"></div>
  <div class="full"><label>رابط الموقع على الخرائط (باركود الموقع)</label><input id="f_map" dir="ltr"></div>
 </div>
 <div class="act"><button class="pr" id="sv">حفظ الفعالية</button><button id="nw">فعالية جديدة</button></div>
 <div id="links" hidden><h3>الروابط</h3><label>رابط العميل (إضافة الأسماء وتصدير الدعوات)</label><input class="lk" id="lc" readonly><label style="margin-top:8px">رابط الماسح (موظفو الحفل)</label><input class="lk" id="ls" readonly></div>
</section>
<section class="panel"><h3 style="margin-top:0">الفعاليات</h3><div id="evs"></div></section>
</main>
<script type="module" src="admin.js?v=3"></script></body></html>
